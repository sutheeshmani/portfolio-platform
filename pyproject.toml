[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "portfolio-platform"
version = "0.2.0"
description = "Ledger, valuation engine and API for the ASX/US portfolio platform"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
api = ["fastapi>=0.115", "psycopg[binary]>=3.2", "uvicorn>=0.30"]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["portfolio_core", "portfolio_api"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[tool.mypy]
files = ["src"]
strict = true
